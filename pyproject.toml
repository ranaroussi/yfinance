[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yfinance"
dynamic = ["version"]
description = "Download market data from Yahoo! Finance API"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Ran Aroussi", email = "ran@aroussi.com" }]
keywords = ["pandas", "yahoo finance", "pandas datareader"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    # "Development Status :: 3 - Alpha",
    "Development Status :: 4 - Beta",
    # "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "beautifulsoup4>=4.11.1",
    "curl_cffi>=0.15",
    "lxml>=4.9.0",
    "multitasking>=0.0.7",
    "numpy>=1.16.5",
    "pandas>=1.3.0",
    "peewee>=3.16.2",
    "platformdirs>=2.0.0",
    "protobuf>=3.19.0",
    "pytz>=2022.5",
    "requests>=2.31",
    "websockets>=13.0",
]

[project.optional-dependencies]
repair = [
    "scipy>=1.6.3",
    "scikit-learn>=1.0"
]
dev = [
    "jinja2==3.1.4",
    "pydata-sphinx-theme==0.15.4",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
    "sphinx==8.0.2",
    "sphinx-copybutton==0.5.2",
]

[project.urls]
Homepage = "https://github.com/ranaroussi/yfinance"
Documentation = "https://ranaroussi.github.io/yfinance"
Repository = "https://github.com/ranaroussi/yfinance"
Issues = "https://github.com/ranaroussi/yfinance/issues"
Changelog = "https://github.com/ranaroussi/yfinance/blob/main/CHANGELOG.rst"

[tool.setuptools.dynamic]
version = { attr = "yfinance.version.version" }

[tool.setuptools.packages.find]
include = ["yfinance*"]

[tool.setuptools.package-data]
yfinance = ["pricing.proto", "pricing_pb2.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE.txt"]

[tool.pyright]
typeCheckingMode = "basic"
reportGeneralTypeIssues = "warning"
reportArgumentType = "warning"
reportOptionalMemberAccess = "warning"
reportOperatorIssue = "warning"
reportAttributeAccessIssue = "warning"
reportMissingImports = "warning"
reportReturnType = "warning"
reportAssignmentType = "warning"
reportOptionalSubscript = "warning"
reportOptionalIterable = "warning"
reportCallIssue = "warning"
reportUnhashable = "warning"
