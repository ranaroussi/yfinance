name: zizmor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        # Verify: bash maintainer/verify_github_actions.sh actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        # Verify: bash maintainer/verify_github_actions.sh zizmorcore/zizmor-action
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
