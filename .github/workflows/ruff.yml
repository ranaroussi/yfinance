name: Ruff
on:
  pull_request:
    branches:
      - master
      - main
      - dev
jobs:
  ruff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Verify: bash maintainer/verify_github_actions.sh actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Verify: bash maintainer/verify_github_actions.sh astral-sh/ruff-action
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: check .
